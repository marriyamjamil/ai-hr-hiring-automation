# Deploys the BACKEND (the backend/ folder only) to Azure App Service: arcadia-hireai-api
# Docs: https://github.com/Azure/webapps-deploy

name: Deploy backend to Azure (arcadia-hireai-api)

on:
  push:
    branches:
      - 'main'
    paths:  # only when backend files (or this file) change; frontend changes don't redeploy the backend
      - 'backend/**'
      - '.github/workflows/main_arcadia-hireai-api.yml'
  workflow_dispatch:  # also allows "Run workflow" by hand on GitHub → Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # required for actions/checkout
    defaults:
      run:
        working-directory: backend  # the Python project lives here

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Quick check that all packages install, so problems show up here and not on Azure
      - name: Install dependencies (check)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # Upload ONLY the backend folder. Azure installs the packages itself
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true), so the virtual environment is left out.
      - name: Upload backend for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            !backend/antenv/
            !backend/**/__pycache__/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'arcadia-hireai-api'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_434AEAE78B2B414692512EAA1FFC0DB2 }}
