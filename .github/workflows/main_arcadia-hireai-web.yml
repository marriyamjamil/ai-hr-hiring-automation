# Builds and deploys the FRONTEND (the frontend/ folder only) to Azure App Service: arcadia-hireai-web
# Docs: https://github.com/Azure/webapps-deploy

name: Deploy frontend to Azure (arcadia-hireai-web)

on:
  push:
    branches:
      - 'main'
    paths:  # only when frontend files (or this file) change
      - 'frontend/**'
      - '.github/workflows/main_arcadia-hireai-web.yml'
  workflow_dispatch:  # also allows "Run workflow" by hand on GitHub → Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # required for actions/checkout
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      # NEXT_PUBLIC_ values are baked into the website while building,
      # so they come from GitHub → Settings → Secrets and variables → Actions → Variables
      - name: Build the website
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_VAPI_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPI_PUBLIC_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::The GitHub variable NEXT_PUBLIC_API_URL is missing (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          npm run build

      # The standalone folder has its own small server.js; it needs the static files next to it
      - name: Put the static files next to server.js
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Upload the ready-to-run website
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/.next/standalone
          include-hidden-files: true  # the .next folder starts with a dot and must be included

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download the website
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'arcadia-hireai-web'
          slot-name: 'Production'
          package: .
          type: zip       # deploy as one package (needed for clean + restart below)
          clean: true     # delete the OLD website files first, so no old pages or chunks are left behind
          restart: true   # restart the website, so the new version is really running
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_18ADDA14F52D43F68563D44D27D32E4A }}
